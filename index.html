<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<base target="_top" />
<title>BPA Business360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  :root{
    --ink:#0B1220; --ink-2:#1C2536; --paper:#F6F7FB; --card:#FFFFFF;
    --line:#E4E7F0; --muted:#6B7280; --brand:#12406B; --brand-2:#1C5F9E;
    --gold:#D9A441; --gold-2:#B9832A; --green:#1E8A5F; --red:#C4432B; --amber:#B8860B;
    --sidebar:#0E1C33; --sidebar-hover:#16294A; --sidebar-text:#AEC0DA;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg:0 8px 24px rgba(16,24,40,.10);
    --input-bg:#FFFFFF; --skeleton-a:#EEF0F5; --skeleton-b:#F5F6F9; --hover-row:#FAFBFD;
  }
  body.theme-dark{
    --ink:#EAEEF6; --ink-2:#D2D9E6; --paper:#0B121F; --card:#131C2E;
    --line:#232E45; --muted:#8B96AC; --brand:#3E7FBF; --brand-2:#5B9AD8;
    --gold:#E3B45C; --gold-2:#C99A44; --green:#3FBE85; --red:#E06A4E; --amber:#D9A441;
    --sidebar:#080D18; --sidebar-hover:#141F35; --sidebar-text:#93A5C4;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 8px 28px rgba(0,0,0,.5);
    --input-bg:#0F1728; --skeleton-a:#1B2740; --skeleton-b:#212F4A; --hover-row:#17233A;
  }
  body.theme-dark .brand-mark{color:#1B1305;}
  body.theme-dark ::-webkit-scrollbar-thumb{background:#26324B;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;max-width:100vw;}
  #root{min-height:100vh;overflow-x:hidden;max-width:100vw;}
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D3D9E6;border-radius:8px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  .app-shell{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden;}
  .sidebar{width:248px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;transition:transform .2s ease;z-index:40;}
  .sidebar-brand{padding:22px 20px 14px;display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;color:#20140A;font-size:15px;flex-shrink:0;}
  .brand-name{color:#fff;font-family:'Manrope';font-weight:700;font-size:15.5px;line-height:1.2;}
  .brand-sub{font-size:10.5px;color:#6E85AA;letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}
  .nav-scroll{flex:1;overflow-y:auto;padding:6px 12px 12px;}
  .nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5B7292;padding:16px 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--sidebar-text);margin-bottom:2px;transition:background .12s;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:linear-gradient(90deg,rgba(217,164,65,.18),rgba(217,164,65,.03));color:#fff;box-shadow:inset 2px 0 0 var(--gold);}
  .nav-item svg{flex-shrink:0;opacity:.9;}
  .sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
  .user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;}
  .user-chip:hover{background:var(--sidebar-hover);}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px;flex-shrink:0;}

  .main{margin-left:248px;flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;overflow-x:hidden;}
  .topbar{height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30;}
  .content{padding:24px 28px 60px;max-width:1440px;width:100%;margin:0 auto;box-sizing:border-box;min-width:0;}
  .search-trigger{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted);font-size:13px;width:280px;}
  .kbd{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;max-width:100%;box-sizing:border-box;}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:all .12s;white-space:nowrap;}
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-2);}
  .btn-gold{background:var(--gold);color:#241705;}
  .btn-gold:hover{background:var(--gold-2);}
  .btn-outline{background:var(--card);border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:#B9C2D4;background:var(--hover-row);}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-ghost:hover{background:var(--paper);color:var(--ink);}
  .btn-danger{background:#FCEBE7;color:var(--red);}
  .btn-danger:hover{background:#F8DAD2;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn-icon{padding:8px;}

  .input, select.input, textarea.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;background:var(--input-bg);color:var(--ink);outline:none;transition:border-color .12s, box-shadow .12s;}
  .input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(28,95,158,.12);}
  .label{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;display:block;}
  .field{margin-bottom:14px;}

  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;position:relative;overflow:hidden;}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi-value{font-family:'Manrope';font-weight:800;font-size:24px;margin-top:6px;letter-spacing:-0.02em;}
  .kpi-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}

  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid #EEF0F5;vertical-align:middle;}
  tbody tr:hover{background:var(--hover-row);}
  tbody tr:last-child td{border-bottom:none;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge-green{background:#E4F5EC;color:var(--green);}
  .badge-amber{background:#FCF1DA;color:var(--amber);}
  .badge-red{background:#FCE9E5;color:var(--red);}
  .badge-slate{background:#EEF1F6;color:#4B5A70;}
  .badge-blue{background:#E5EFF8;color:var(--brand-2);}

  .modal-overlay{position:fixed;inset:0;background:rgba(11,18,32,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto;}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .15s ease;}
  .modal.wide{max-width:820px;}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .empty-state{text-align:center;padding:56px 24px;color:var(--muted);}
  .empty-state svg{opacity:.35;margin-bottom:12px;}
  .empty-state h3{font-size:15px;color:var(--ink);margin:0 0 4px;}
  .empty-state p{font-size:13px;margin:0 0 16px;}

  .skeleton{background:linear-gradient(90deg,var(--skeleton-a) 25%,var(--skeleton-b) 37%,var(--skeleton-a) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
  @keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;min-width:220px;animation:toastin .18s ease;}
  .toast.success{background:#12352A;}
  .toast.error{background:#3A1712;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
  .tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--brand);border-color:var(--gold);}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%, #0F2540, #0B1626 60%);padding:24px;}
  .auth-card{width:100%;max-width:440px;background:var(--card);border-radius:18px;padding:36px 34px;box-shadow:0 20px 60px rgba(0,0,0,.35);}

  .cmdk-overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
  .cmdk{width:100%;max-width:560px;background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;}
  .cmdk-input{width:100%;border:none;padding:16px 18px;font-size:15px;outline:none;border-bottom:1px solid var(--line);}
  .cmdk-item{padding:11px 18px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;}
  .cmdk-item.active{background:var(--paper);}

  .stat-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .grid{display:grid;gap:16px;}
  .grid > *, .two-col-wide > *, .two-col-equal > *, .reports-layout > *{min-width:0;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}
  .two-col-wide{display:grid; grid-template-columns:1.6fr 1fr; gap:16px;}
  .two-col-equal{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .one-col{display:grid; grid-template-columns:1fr; gap:16px;}
  .reports-layout{display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:start;}
  @media(max-width:800px){.two-col-wide,.two-col-equal,.reports-layout{grid-template-columns:1fr;}}
  @media(max-width:720px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:none;}
    .main{margin-left:0;}
    .g4,.g3,.g2{grid-template-columns:1fr;}
    .search-trigger{width:auto;flex:1;min-width:0;}
    .search-trigger span:not(.kbd){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .search-trigger .kbd{display:none;}
    .topbar{padding:0 12px;gap:8px;}
    .content{padding:16px 14px 60px;}
  }
  .mobile-menu-btn{display:none;}
  @media(max-width:720px){.mobile-menu-btn{display:flex;}}

  .section-title{font-size:19px;font-weight:800;font-family:'Manrope';letter-spacing:-.01em;}
  .section-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--muted);}
  .icon-btn:hover{color:var(--ink);border-color:#B9C2D4;}
  .fab{position:fixed;bottom:26px;right:26px;z-index:60;}

  /* ============ LANDING PAGE ============ */
  .landing{background:var(--paper); min-height:100vh;}
  .landing-nav{position:sticky; top:0; z-index:50; background:rgba(246,247,251,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:14px 5vw;}
  .landing-nav .navlinks{display:flex; gap:28px; font-size:13.5px; font-weight:600; color:var(--ink-2);}
  .landing-nav .navlinks a{cursor:pointer;}
  .landing-nav .navlinks a:hover{color:var(--brand);}
  @media(max-width:760px){.landing-nav .navlinks{display:none;}}

  .hero{position:relative; background:linear-gradient(160deg, var(--sidebar) 0%, #0A1830 62%, #0A1E3D 100%); color:#fff; overflow:hidden; padding:0 5vw;}
  .ledger-rule{position:absolute; left:64px; top:0; bottom:0; width:1px; background:rgba(217,164,65,.32);}
  .ledger-lines{position:absolute; inset:0; background-image:repeating-linear-gradient(to bottom, transparent, transparent 34px, rgba(255,255,255,.045) 35px); pointer-events:none;}
  .hero-inner{position:relative; z-index:2; max-width:1320px; margin:0 auto; padding:76px 0 90px; display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center;}
  @media(max-width:980px){.hero-inner{grid-template-columns:1fr; padding:52px 0 60px;}}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); background:rgba(217,164,65,.12); border:1px solid rgba(217,164,65,.3); padding:6px 13px; border-radius:20px; margin-bottom:22px;}
  .hero h1{font-family:'Manrope'; font-weight:800; font-size:44px; line-height:1.08; letter-spacing:-0.02em; margin:0 0 18px; color:#fff;}
  .hero h1 em{font-style:normal; color:var(--gold);}
  @media(max-width:980px){.hero h1{font-size:32px;}}
  .hero-sub{font-size:16px; line-height:1.6; color:#B7C4DA; max-width:480px; margin:0 0 30px;}
  .hero-ctas{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:34px;}
  .hero-ctas .btn{padding:13px 24px; font-size:14.5px;}
  .hero-trust{display:flex; gap:26px; flex-wrap:wrap; font-size:12px; color:#8CA0BE;}
  .hero-trust span{display:flex; align-items:center; gap:6px;}

  .mock-wrap{position:relative; perspective:1400px;}
  .mock-card{background:var(--card); border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.45); padding:0; overflow:hidden; transform:rotateY(-9deg) rotateX(3deg) rotate(1deg); transition:transform .4s ease;}
  .mock-wrap:hover .mock-card{transform:rotateY(-4deg) rotateX(1deg) rotate(0.5deg);}
  .mock-topbar{display:flex; align-items:center; gap:6px; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--hover-row);}
  .mock-dot{width:8px; height:8px; border-radius:50%; background:#DADFE8;}
  .mock-body{padding:18px;}
  .mock-kpi{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px;}
  .mock-badge{position:absolute; top:-14px; right:22px; background:var(--gold); color:#241705; font-size:11px; font-weight:800; padding:6px 13px; border-radius:20px; box-shadow:0 8px 20px rgba(217,164,65,.4); z-index:3;}
  .float-chip{position:absolute; background:var(--card); border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.25); padding:11px 14px; z-index:3; display:flex; align-items:center; gap:9px; font-size:12px; font-weight:700;}

  .stats-strip{background:var(--ink); position:relative; overflow:hidden;}
  .stats-strip .ledger-lines{opacity:.6;}
  .stats-inner{position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:30px 5vw; display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px;}
  .stat-num{font-family:'Manrope'; font-weight:800; font-size:26px; color:#fff;}
  .stat-lbl{font-size:11.5px; color:#8CA0BE; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .section{max-width:1200px; margin:0 auto; padding:80px 5vw;}
  .section-head{max-width:600px; margin:0 auto 44px; text-align:center;}
  .section-head .eyebrow{background:rgba(18,64,107,.08); color:var(--brand); border-color:rgba(18,64,107,.18);}
  .section-head h2{font-family:'Manrope'; font-weight:800; font-size:30px; letter-spacing:-0.01em; margin:0 0 12px; color:var(--ink);}
  .section-head p{font-size:14.5px; color:var(--muted); line-height:1.6; margin:0;}

  .feat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.feat-grid{grid-template-columns:1fr;}}
  .feat-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; transition:transform .15s, box-shadow .15s;}
  .feat-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#D7DEEA;}
  .feat-icon{width:42px; height:42px; border-radius:11px; background:linear-gradient(135deg, var(--brand), var(--brand-2)); display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:16px;}
  .feat-card h3{font-size:15px; margin:0 0 6px; font-family:'Manrope'; font-weight:700;}
  .feat-card p{font-size:13px; color:var(--muted); margin:0; line-height:1.55;}

  .cta-band{background:linear-gradient(135deg, var(--brand) 0%, #0E355A 100%); border-radius:24px; padding:56px 48px; text-align:center; position:relative; overflow:hidden; margin:0 5vw 0;}
  @media(max-width:700px){.cta-band{padding:40px 24px;}}
  .cta-band h2{color:#fff; font-family:'Manrope'; font-weight:800; font-size:27px; margin:0 0 10px;}
  .cta-band p{color:#B7C4DA; font-size:14px; margin:0 0 26px;}

  .landing-footer{border-top:1px solid var(--line); padding:34px 5vw; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--muted);}
  @media(max-width:700px){.landing-footer{flex-direction:column; text-align:center;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

// ============================== ICONS (inline SVG, no external deps) ==============================
const Icon = ({ path, size=17, strokeWidth=1.9, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" {...rest}>
    <path d={path} />
  </svg>
);
const ICONS = {
  dashboard: "M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z",
  sales: "M3 3h2l.4 2M7 13h10l3-8H5.4M7 13L5.4 5M7 13l-2 8h13M9 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z",
  products: "M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8",
  inventory: "M3 7h18v13H3zM3 7l2-4h14l2 4M9 11h6",
  customers: "M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75",
  suppliers: "M3 3h18v18H3zM3 9h18M9 21V9",

// ============================== BACKEND CONFIG ==============================
// This file is designed to be pasted into the SAME Apps Script project as Code.gs and served via
// doGet() -- in that setup (the default/recommended one) this section can stay exactly as-is,
// because google.script.run talks to the backend automatically with no configuration needed.
//
// If you instead want to host this index.html file somewhere else (a static site, a subdomain,
// etc.) and call a Code.gs backend deployed separately, deploy Code.gs as a Web App
// (Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone), copy the
// resulting URL (ends in /exec), and paste it below. The app will then talk to it over HTTPS
// automatically whenever it detects it isn't running inside the Apps Script iframe.
const APP_CONFIG = {
  WEBAPP_URL: '' // e.g. 'https://script.google.com/macros/s/AKfycb.../exec' -- leave blank for the default setup
};

// ============================== API CLIENT ==============================
function callServer(action, payload) {
  const token = window.__platformToken || (window.__session ? window.__session.token : null);

  if (window.google && window.google.script && window.google.script.run) {
    // Default path: served directly by Apps Script's HtmlService.
    return new Promise((resolve) => {
      google.script.run
        .withSuccessHandler((res) => resolve(res))
        .withFailureHandler((err) => resolve({ success: false, message: (err && err.message) || 'Connection error. Please try again.' }))
        .apiCall(action, payload || {}, token);
    });
  }

  if (APP_CONFIG.WEBAPP_URL) {
    // Hosted separately: call the deployed Web App's doPost() over HTTPS.
    // text/plain avoids a CORS preflight request, which Apps Script Web Apps don't handle.
    return fetch(APP_CONFIG.WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {}, token })
    })
      .then((res) => res.json())
      .catch(() => ({ success: false, message: 'Could not reach the backend. Check APP_CONFIG.WEBAPP_URL at the top of index.html.' }));
  }

  // Neither is available -- e.g. this file was opened directly as a local file.
  return new Promise((resolve) => {
    setTimeout(() => resolve({ success: false, message: 'Backend not connected. Deploy this as an Apps Script Web App, or set APP_CONFIG.WEBAPP_URL.' }), 300);
  });
}

// ============================== FORMAT HELPERS ==============================
function useCurrency() {
  const { business } = useApp();
  const symbol = (business && business.currencySymbol) || '\u20A6';
  return useCallback((n) => {
    const val = Number(n || 0);
    return symbol + val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }, [symbol]);
}
function fmtDate(d) {
  if (!d) return '\u2014';
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(d) {
  if (!d) return '\u2014';
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString(undefined, { day:'2-digit', month:'short' }) + ' ' + dt.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function initials(name) {
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

// ============================== TOASTS ==============================
const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type='success') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className={"toast " + t.type}>
            <I name={t.type==='error'?'alert':'check'} size={15} />
            {t.message}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast() { return useContext(ToastCtx); }

function Skeleton({ h=16, w='100%', r=8 }) { return <div className="skeleton" style={{height:h, width:w, borderRadius:r}} />; }

function EmptyState({ icon='package', title, subtitle, action }) {

      <I name={icon} size={40} strokeWidth={1.3} />
      <h3>{title}</h3>
      {subtitle && <p>{subtitle}</p>}
      {action}
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {
    'Paid':'green','Completed':'green','Active':'green','In Stock':'green','Current':'green','Received':'green',
    'Partial':'amber','Low Stock':'amber','Due Soon':'amber','Draft':'slate','Pending':'amber','Trial':'amber',
    'Unpaid':'red','Out of Stock':'red','Overdue':'red','Inactive':'red','Voided':'red','Deleted':'red',
    'Ordered':'blue'
  };
  const cls = map[status] || 'slate';
  return <span className={"badge badge-"+cls}>{status}</span>;
}

function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={"modal" + (wide ? " wide" : "")}>
        <div className="modal-head">
          <h3 style={{margin:0, fontSize:16, fontWeight:800}}>{title}</h3>
          <button className="icon-btn" onClick={onClose}><I name="x" size={16} /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function ConfirmDialog({ title, message, confirmLabel='Delete', danger=true, onConfirm, onClose }) {
  return (
    <Modal title={title} onClose={onClose} footer={
      <React.Fragment>
        <button className="btn btn-outline" onClick={onClose}>Cancel</button>
        <button className={"btn " + (danger ? "btn-danger" : "btn-primary")} onClick={() => { onConfirm(); onClose(); }}>{confirmLabel}</button>
      </React.Fragment>
    }>
      <p style={{fontSize:13.5, color:'var(--muted)', margin:0}}>{message}</p>
    </Modal>
  );
}

/** Delete dialog that requires a typed reason before the delete action runs. Used everywhere records can be deleted. */
function DeleteWithReasonDialog({ title, itemLabel, onConfirm, onClose }) {
  const [reason, setReason] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!reason.trim()) return;
    setBusy(true);
    await onConfirm(reason.trim());
    setBusy(false);
    onClose();
  };
  return (
    <Modal title={title || 'Delete record'} onClose={onClose} footer={
      <React.Fragment>
        <button className="btn btn-outline" onClick={onClose}>Cancel</button>
        <button className="btn btn-danger" disabled={!reason.trim() || busy} onClick={submit}>{busy ? 'Deleting\u2026' : 'Delete'}</button>
      </React.Fragment>
    }>
      <p style={{fontSize:13.5, color:'var(--muted)', margin:'0 0 14px'}}>
        {itemLabel ? <React.Fragment>Deleting <b>{itemLabel}</b>. </React.Fragment> : null}
        This moves the record to the Recycle Bin, where it can be restored later. Please give a reason.
      </p>
      <Field label="Reason for deletion">
        <textarea className="input" rows={3} autoFocus value={reason} onChange={e=>setReason(e.target.value)} placeholder="e.g. Duplicate entry, entered in error\u2026" />
      </Field>
    </Modal>
  );
}

function Field({ label, children }) {
  return <div className="field"><label className="label">{label}</label>{children}</div>;

function DataTable({ columns, rows, loading, emptyIcon, emptyTitle, emptySubtitle, emptyAction, rowKey, onRowClick }) {

      <table>

// ---------- Lightweight SVG charts (no external chart lib needed) ----------
function LineChartSvg({ data, xKey, yKey, color='#1C5F9E', height=200 }) {
  const w = 640;
  const pad = 30;
  const values = data.map(d => Number(d[yKey]) || 0);
  const max = Math.max(1, ...values);
  const min = 0;
  const stepX = (w - pad*2) / Math.max(1, data.length - 1);
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = height - pad - ((Number(d[yKey])||0) - min) / (max - min || 1) * (height - pad*2);
    return [x, y];
  });
  const path = points.map((p, i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${points[points.length-1][0].toFixed(1)},${height-pad} L${points[0][0].toFixed(1)},${height-pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} style={{width:'100%', height:'auto'}}>
      <defs>
        <linearGradient id="lcGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <line x1={pad} y1={height-pad} x2={w-pad} y2={height-pad} stroke="#E4E7F0" strokeWidth="1" />
      <path d={areaPath} fill="url(#lcGrad)" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (i % Math.ceil(points.length/7) === 0) && <circle key={i} cx={p[0]} cy={p[1]} r="2.6" fill={color} />)}
      {data.map((d, i) => (i % Math.ceil(data.length/6) === 0) && (
        <text key={i} x={pad + i*stepX} y={height-8} fontSize="9.5" fill="#9AA4B5" textAnchor="middle">{d[xKey]}</text>
      ))}
    </svg>
  );
}

function DonutChartSvg({ data, size=180 }) {
  const colors = ['#12406B','#D9A441','#1E8A5F','#C4432B','#6E5AA6','#1C5F9E','#B8860B','#4B5A70'];
  const total = data.reduce((s,d) => s + Number(d.value||0), 0) || 1;
  let acc = 0;
  const r = size/2 - 14, cx = size/2, cy = size/2;
  const circumference = 2 * Math.PI * r;
  if (!data.length) return <EmptyState icon="chart" title="No sales yet" subtitle="Category breakdown appears once you record sales." />;
  return (
    <div style={{display:'flex', alignItems:'center', gap:20, flexWrap:'wrap'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <g transform={`rotate(-90 ${cx} ${cy})`}>
          {data.map((d, i) => {
            const frac = Number(d.value||0) / total;
            const dash = frac * circumference;
            const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={colors[i%colors.length]} strokeWidth="20"
              strokeDasharray={`${dash} ${circumference-dash}`} strokeDashoffset={-acc} />;
            acc += dash;
            return el;
          })}
        </g>
        <text x={cx} y={cy-2} textAnchor="middle" fontSize="15" fontWeight="800" fill="var(--ink)">{data.length}</text>
        <text x={cx} y={cy+14} textAnchor="middle" fontSize="9.5" fill="var(--muted)">categories</text>
      </svg>
      <div style={{display:'flex', flexDirection:'column', gap:7, fontSize:12.5}}>
        {data.slice(0,6).map((d,i) => (
          <div key={i} style={{display:'flex', alignItems:'center', gap:7}}>
            <span style={{width:9, height:9, borderRadius:3, background:colors[i%colors.length], display:'inline-block'}} />
            <span style={{color:'var(--muted)'}}>{d.name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function BarListChart({ data, valueKey, labelKey }) {
  const max = Math.max(1, ...data.map(d => Number(d[valueKey])||0));
  return (
    <div style={{display:'flex', flexDirection:'column', gap:12}}>
      {data.map((d,i) => (
        <div key={i}>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:12.5, marginBottom:4}}>
            <span style={{fontWeight:600}}>{d[labelKey]}</span>
            <span style={{color:'var(--muted)'}}>{d[valueKey]}</span>
          </div>
          <div style={{height:7, background:'#EEF0F5', borderRadius:6, overflow:'hidden'}}>
            <div style={{height:'100%', width:(Number(d[valueKey])/max*100)+'%', background:'linear-gradient(90deg, var(--brand), var(--brand-2))', borderRadius:6}} />
          </div>
        </div>
      ))}
    </div>
  );
}

function CommandPalette({ onClose, dispatch }) {
  const [q, setQ] = useState('');
  const [idx, setIdx] = useState(0);
  const filtered = COMMANDS.filter(c => c.label.toLowerCase().includes(q.toLowerCase()));
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
  useEffect(() => setIdx(0), [q]);
  const go = (cmd) => { dispatch(cmd); onClose(); };
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setIdx(i => Math.min(i+1, filtered.length-1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setIdx(i => Math.max(i-1, 0)); }
    else if (e.key === 'Enter') { if (filtered[idx]) go(filtered[idx]); }
    else if (e.key === 'Escape') onClose();
  };
  return (
    <div className="cmdk-overlay" onMouseDown={(e) => { if (e.target===e.currentTarget) onClose(); }}>
      <div className="cmdk">
        <input ref={inputRef} className="cmdk-input" placeholder="Type a command or search\u2026" value={q}
          onChange={e => setQ(e.target.value)} onKeyDown={onKey} />
        <div style={{maxHeight:320, overflowY:'auto', padding:'6px 0'}}>
          {filtered.length === 0 && <div style={{padding:'20px 18px', fontSize:13, color:'var(--muted)'}}>No matches.</div>}
          {filtered.map((c,i) => (
            <div key={c.label} className={"cmdk-item" + (i===idx?" active":"")} onMouseEnter={() => setIdx(i)} onClick={() => go(c)} style={{cursor:'pointer'}}>
              <span style={{display:'flex', alignItems:'center', gap:10}}><I name={c.icon} size={15} style={{color:'var(--muted)'}} />{c.label}</span>
              <I name="arrowRight" size={13} style={{color:'#C7CEDA'}} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

              <button className="btn btn-outline" onClick={() => setStep(2)}>Back</button>
              <button className="btn btn-gold" style={{flex:1, justifyContent:'center'}} disabled={loading} onClick={submit}>
                {loading ? 'Creating your workspace\u2026' : 'Create Business'}
              </button>
            </div>
          </React.Fragment>
        )}

        <div style={{textAlign:'center', marginTop:16, fontSize:13, color:'var(--muted)'}}>
          Already have an account? <a onClick={onGotoLogin} style={{color:'var(--brand-2)', fontWeight:600, cursor:'pointer'}}>Sign in</a>
        </div>
      </div>
    </div>
  );
}

// ============================== DATA HOOK ==============================
function useApiData(action, payload, deps=[]) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const toast = useToast();
  const reload = useCallback(() => {
    setLoading(true);
    callServer(action, payload).then(res => {
      setLoading(false);
      if (res.success) setData(res.data);
      else { setError(res.message); toast && toast(res.message, 'error'); }
    });
  }, deps); // eslint-disable-line
  useEffect(() => { reload(); }, deps); // eslint-disable-line
  return { data, loading, error, reload };
}

  receivables:        { label: 'Accounts Receivable', accent: 'var(--amber)', sub: (k) => `${k.outstandingInvoices} unpaid invoice(s)` },
  inventoryValue:     { label: 'Inventory Value', accent: 'var(--brand-2)', sub: (k) => `${k.productCount} products \u00b7 ${k.lowStockCount} low stock` },
  totalSales:         { label: 'Total Sales' },

function DashboardPage({ dispatch }) {

  const k = data.kpis;
  const view = data.roleView || { kpis: Object.keys(KPI_DEFS).slice(0,4), sections: ['trend','category','topProducts','lowStock','recent'] };
  const has = (s) => view.sections.indexOf(s) !== -1;

        {view.kpis.map(key => {
          const def = KPI_DEFS[key];
          if (!def) return null;
          const raw = k[key];
          const value = def.isCount ? String(raw) : fmt(raw);
          const sub = typeof def.sub === 'function' ? def.sub(k, fmt) : def.sub;
          return <KpiCard key={key} label={def.label} value={value} sub={sub} accent={def.accent} />;
        })}

      {(has('trend') || has('category')) && (
        <div className={(has('trend') && has('category')) ? "two-col-wide" : "one-col"} style={{marginTop:16}}>

              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>

                <div style={{display:'flex', flexDirection:'column', gap:10}}>

function ProductFormModal({ onClose, onSaved, categories, product }) {
  const toast = useToast();
  const [form, setForm] = useState(product || { productName:'', sku:'', categoryId: categories[0] ? categories[0].categoryId : '', costPrice:'', sellingPrice:'', unit:'unit', reorderLevel:10, openingStock:0, avgConsumptionDays:30 });
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f => ({...f, [k]:v}));
  const submit = async () => {
    if (!form.productName || !form.sellingPrice) { toast('Product name and selling price are required.', 'error'); return; }
    setSaving(true);
    const res = product
      ? await callServer('products.update', { id: product.productId, data: form })
      : await callServer('products.create', form);
    setSaving(false);
    if (res.success) { toast(product ? 'Product updated.' : 'Product added.'); onSaved(); onClose(); }
    else toast(res.message, 'error');
  };
  return (
    <Modal title={product ? 'Edit Product' : 'Add Product'} onClose={onClose} footer={
      <React.Fragment><button className="btn btn-outline" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" disabled={saving} onClick={submit}>{saving ? 'Saving\u2026' : 'Save Product'}</button></React.Fragment>
    }>
      <div className="grid g2">
        <Field label="Product name"><input className="input" value={form.productName} onChange={e=>set('productName', e.target.value)} /></Field>
        <Field label="SKU (auto if blank)"><input className="input" value={form.sku} onChange={e=>set('sku', e.target.value)} /></Field>
      </div>
      <div className="grid g2">
        <Field label="Category">
          <select className="input" value={form.categoryId} onChange={e=>set('categoryId', e.target.value)}>
            {categories.map(c => <option key={c.categoryId} value={c.categoryId}>{c.categoryName}</option>)}
          </select>
        </Field>
        <Field label="Unit"><input className="input" value={form.unit} onChange={e=>set('unit', e.target.value)} placeholder="e.g. carton, kg, unit" /></Field>
      </div>
      <div className="grid g3">
        <Field label="Cost price"><input className="input" type="number" value={form.costPrice} onChange={e=>set('costPrice', e.target.value)} /></Field>
        <Field label="Selling price"><input className="input" type="number" value={form.sellingPrice} onChange={e=>set('sellingPrice', e.target.value)} /></Field>
        <Field label="Reorder level"><input className="input" type="number" value={form.reorderLevel} onChange={e=>set('reorderLevel', e.target.value)} /></Field>
      </div>
      {!product && <Field label="Opening stock (primary location)"><input className="input" type="number" value={form.openingStock} onChange={e=>set('openingStock', e.target.value)} /></Field>}
      <Field label="Days 1 unit typically lasts a customer">
        <input className="input" type="number" value={form.avgConsumptionDays} onChange={e=>set('avgConsumptionDays', e.target.value)} placeholder="30" />
      </Field>
      <p style={{fontSize:11.5, color:'var(--muted)', margin:'-8px 0 0'}}>Used to predict when a customer is about to run out, so we can email them a restock reminder.</p>
    </Modal>
  );
}

  );

function StockMovementModal({ direction, onClose, onSaved, products, locations }) {
  const toast = useToast();
  const isIn = direction === 'in';
  const [form, setForm] = useState({ productId: products[0] ? products[0].productId : '', locationId: locations[0] ? locations[0].locationId : '', quantity:'', reason:'' });
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  useEffect(() => {
    setForm(f => ({
      ...f,
      productId: f.productId || (products[0] ? products[0].productId : ''),
      locationId: f.locationId || (locations[0] ? locations[0].locationId : '')
    }));
  }, [products, locations]);
  const submit = async () => {
    if (!form.productId || !form.locationId) { toast('Select a product and location.', 'error'); return; }
    const qty = Number(form.quantity);
    if (!qty || qty <= 0) { toast('Enter a quantity greater than zero.', 'error'); return; }
    if (!form.reason.trim()) { toast('A reason is required.', 'error'); return; }
    setSaving(true);
    const res = await callServer('inventory.adjust', { productId: form.productId, locationId: form.locationId, reason: form.reason, quantityChange: isIn ? qty : -qty });
    setSaving(false);
    if (res.success) { toast(isIn ? 'Stock added.' : 'Stock removed.'); onSaved(); onClose(); } else toast(res.message, 'error');
  };
  return (
    <Modal title={isIn ? 'Stock In' : 'Stock Out'} onClose={onClose} footer={<React.Fragment>
      <button className="btn btn-outline" onClick={onClose}>Cancel</button>
      <button className={isIn ? "btn btn-primary" : "btn btn-danger"} disabled={saving} onClick={submit}>{saving?'Saving\u2026':(isIn?'Add Stock':'Remove Stock')}</button>
    </React.Fragment>}>
      <Field label="Product"><select className="input" value={form.productId} onChange={e=>set('productId', e.target.value)}>{products.map(p=><option key={p.productId} value={p.productId}>{p.productName}</option>)}</select></Field>
      <Field label="Location"><select className="input" value={form.locationId} onChange={e=>set('locationId', e.target.value)}>{locations.map(l=><option key={l.locationId} value={l.locationId}>{l.locationName}</option>)}</select></Field>
      <Field label="Quantity"><input className="input" type="number" min="1" value={form.quantity} onChange={e=>set('quantity', e.target.value)} /></Field>
      <Field label="Reason">
        <input className="input" value={form.reason} onChange={e=>set('reason', e.target.value)}
          placeholder={isIn ? 'e.g. New delivery received, stock count correction\u2026' : 'e.g. Damaged goods, expired, stock count correction\u2026'} />
      </Field>
    </Modal>
  );
}

function POSModal({ onClose, onSaved, products, customers, locations }) {
  const fmt = useCurrency();
  const toast = useToast();
  const { business } = useApp();
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState('');
  const [customerId, setCustomerId] = useState('');
  const [locationId, setLocationId] = useState(locations[0] ? locations[0].locationId : '');
  const [paymentMethod, setPaymentMethod] = useState('Cash');
  const [amountPaid, setAmountPaid] = useState('');
  const [discount, setDiscount] = useState(0);
  const [applyVat, setApplyVat] = useState(true);
  const [saving, setSaving] = useState(false);
  const [result, setResult] = useState(null);

  // locations often arrive after this modal's first render (async fetch) — sync the default once they load
  useEffect(() => { if (!locationId && locations.length) setLocationId(locations[0].locationId); }, [locations]);

  const filteredProducts = products.filter(p => !search || p.productName.toLowerCase().includes(search.toLowerCase()) || String(p.sku).toLowerCase().includes(search.toLowerCase()));

  const addToCart = (p) => {
    setCart(c => {
      const existing = c.find(i => i.productId === p.productId);
      if (existing) return c.map(i => i.productId===p.productId ? {...i, quantity:i.quantity+1} : i);
      return [...c, { productId:p.productId, productName:p.productName, unitPrice:Number(p.sellingPrice), quantity:1, discount:0 }];
    });
  };
  const updateQty = (pid, qty) => setCart(c => c.map(i => i.productId===pid ? {...i, quantity: Math.max(1, qty)} : i));
  const removeItem = (pid) => setCart(c => c.filter(i => i.productId !== pid));

  const vatRate = Number((business && business.vatRate) || 7.5);
  function round2Local(n){ return Math.round(n*100)/100; }
  const subtotal = cart.reduce((s,i) => s + i.quantity*i.unitPrice - (i.discount||0), 0);
  const vatEstimate = applyVat ? round2Local(subtotal * (vatRate/100)) : 0;
  const total = subtotal + vatEstimate;

  const submit = async () => {
    if (!cart.length) { toast('Add at least one product to the cart.', 'error'); return; }
    if (!locationId) { toast('Select a location.', 'error'); return; }
    setSaving(true);
    const res = await callServer('sales.create', {
      customerId, locationId, items: cart.map(i => ({ productId:i.productId, quantity:i.quantity, unitPrice:i.unitPrice, discount:i.discount||0 })),
      discount: Number(discount||0), paymentMethod, amountPaid: amountPaid===''? total : Number(amountPaid), applyVat
    });
    setSaving(false);
    if (res.success) { setResult(res.data); toast('Sale recorded.'); onSaved(); }
    else toast(res.message, 'error');
  };

  if (result) {
    return (
      <Modal title="Sale Complete" onClose={() => { onClose(); }} footer={<button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={onClose}>Done</button>}>
        <div style={{textAlign:'center', padding:'10px 0'}}>
          <div style={{width:52, height:52, borderRadius:'50%', background:'#E4F5EC', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 14px'}}>
            <I name="check" size={26} style={{color:'var(--green)'}} />
          </div>
          <h3 style={{margin:'0 0 4px'}}>Invoice {result.invoice.invoiceNumber}</h3>
          <p style={{color:'var(--muted)', fontSize:13, margin:'0 0 16px'}}>Total {fmt(result.sale.total)} \u00b7 {result.sale.paymentStatus}</p>
        </div>
      </Modal>
    );
  }

  return (
    <Modal title="New Sale" onClose={onClose} wide footer={<React.Fragment>
      <button className="btn btn-outline" onClick={onClose}>Cancel</button>
      <button className="btn btn-gold" disabled={saving} onClick={submit}>{saving?'Processing\u2026':`Complete Sale \u2014 ${fmt(total)}`}</button>
    </React.Fragment>}>
      <div className="grid g2" style={{alignItems:'start'}}>
        <div>
          <input className="input" placeholder="Search product or SKU\u2026" value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}} />
          <div style={{maxHeight:280, overflowY:'auto', border:'1px solid var(--line)', borderRadius:9}}>
            {filteredProducts.slice(0,40).map(p => (
              <div key={p.productId} onClick={()=>addToCart(p)} style={{display:'flex', justifyContent:'space-between', padding:'9px 12px', borderBottom:'1px solid #EEF0F5', cursor:'pointer', fontSize:13}}>
                <span>{p.productName}</span><span style={{color:'var(--muted)'}}>{fmt(p.sellingPrice)}</span>
              </div>
            ))}
            {filteredProducts.length===0 && <div style={{padding:16, fontSize:13, color:'var(--muted)'}}>No products found.</div>}
          </div>
        </div>
        <div>
          <div style={{fontWeight:700, fontSize:13, marginBottom:8}}>Cart ({cart.length})</div>
          <div style={{maxHeight:200, overflowY:'auto', marginBottom:10}}>
            {cart.length===0 && <div style={{fontSize:12.5, color:'var(--muted)', padding:'12px 0'}}>Cart is empty. Click products to add.</div>}
            {cart.map(i => (
              <div key={i.productId} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 0', borderBottom:'1px solid #EEF0F5'}}>
                <div style={{flex:1, fontSize:12.5}}>{i.productName}</div>
                <input className="input" type="number" min="1" value={i.quantity} onChange={e=>updateQty(i.productId, Number(e.target.value))} style={{width:56, padding:'5px 7px', fontSize:12.5}} />
                <div style={{width:70, fontSize:12.5, textAlign:'right'}}>{fmt(i.quantity*i.unitPrice)}</div>
                <button className="icon-btn" style={{width:26, height:26}} onClick={()=>removeItem(i.productId)}><I name="x" size={12} /></button>
              </div>
            ))}
          </div>
          <div className="grid g2">
            <Field label="Customer">
              <select className="input" value={customerId} onChange={e=>setCustomerId(e.target.value)}>
                <option value="">Walk-in Customer</option>
                {customers.map(c=><option key={c.customerId} value={c.customerId}>{c.customerName}</option>)}
              </select>
            </Field>
            <Field label="Location">
              <select className="input" value={locationId} onChange={e=>setLocationId(e.target.value)}>
                {locations.map(l=><option key={l.locationId} value={l.locationId}>{l.locationName}</option>)}
              </select>
            </Field>
          </div>
          <div className="grid g2">
            <Field label="Payment method">
              <select className="input" value={paymentMethod} onChange={e=>setPaymentMethod(e.target.value)}>
                {['Cash','Bank Transfer','POS','Card','Mobile Money','Other'].map(m=><option key={m}>{m}</option>)}
              </select>
            </Field>
            <Field label="Amount paid (blank = full)"><input className="input" type="number" value={amountPaid} onChange={e=>setAmountPaid(e.target.value)} placeholder={total.toFixed(2)} /></Field>
          </div>
          <div className="divider" />
          <div style={{fontSize:13}}>
            <div style={{display:'flex', justifyContent:'space-between', padding:'3px 0'}}><span style={{color:'var(--muted)'}}>Subtotal</span><span>{fmt(subtotal)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'5px 0'}}>
              <button type="button" onClick={()=>setApplyVat(v=>!v)}
                style={{display:'flex', alignItems:'center', gap:7, background:'none', border:'none', padding:0, cursor:'pointer', color:'var(--muted)'}}>
                <span style={{width:16, height:16, borderRadius:4, border:'1.5px solid ' + (applyVat?'var(--brand)':'#C7CEDA'), background:applyVat?'var(--brand)':'#fff', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  {applyVat && <I name="check" size={11} style={{color:'#fff'}} />}
                </span>
                VAT ({vatRate}%)
              </button>
              <span>{fmt(vatEstimate)}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'6px 0', fontWeight:800, fontSize:15}}><span>Total</span><span>{fmt(total)}</span></div>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function POFormModal({ onClose, onSaved, suppliers, products, locations }) {
  const fmt = useCurrency();
  const toast = useToast();
  const [supplierId, setSupplierId] = useState(suppliers[0] ? suppliers[0].supplierId : '');
  const [locationId, setLocationId] = useState(locations[0] ? locations[0].locationId : '');
  const [expectedDeliveryDate, setExpectedDeliveryDate] = useState('');
  const [items, setItems] = useState([{ productId:'', quantity:1, unitCost:0 }]);
  const [saving, setSaving] = useState(false);
  useEffect(() => { if (!supplierId && suppliers.length) setSupplierId(suppliers[0].supplierId); }, [suppliers]);
  useEffect(() => { if (!locationId && locations.length) setLocationId(locations[0].locationId); }, [locations]);
  const addLine = () => setItems(i => [...i, { productId:'', quantity:1, unitCost:0 }]);
  const updateLine = (idx, patch) => setItems(i => i.map((it,ix) => ix===idx ? {...it, ...patch} : it));
  const removeLine = (idx) => setItems(i => i.filter((_,ix)=>ix!==idx));
  const total = items.reduce((s,i)=>s+Number(i.quantity||0)*Number(i.unitCost||0), 0);

  const submit = async () => {
    const valid = items.filter(i => i.productId && i.quantity > 0);
    if (!valid.length || !supplierId || !locationId) { toast('Supplier, location and at least one item are required.', 'error'); return; }
    setSaving(true);
    const res = await callServer('purchaseOrders.create', { supplierId, locationId, expectedDeliveryDate, items: valid });
    setSaving(false);
    if (res.success) { toast('Purchase order created.'); onSaved(); onClose(); } else toast(res.message, 'error');
  };

  return (
    <Modal title="New Purchase Order" onClose={onClose} wide footer={<React.Fragment>
      <button className="btn btn-outline" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" disabled={saving} onClick={submit}>{saving?'Creating\u2026':`Create PO \u2014 ${fmt(total)}`}</button>
    </React.Fragment>}>
      <div className="grid g2">
        <Field label="Supplier"><select className="input" value={supplierId} onChange={e=>setSupplierId(e.target.value)}>{suppliers.map(s=><option key={s.supplierId} value={s.supplierId}>{s.supplierName}</option>)}</select></Field>
        <Field label="Delivery location"><select className="input" value={locationId} onChange={e=>setLocationId(e.target.value)}>{locations.map(l=><option key={l.locationId} value={l.locationId}>{l.locationName}</option>)}</select></Field>
      </div>
      <Field label="Expected delivery date"><input className="input" type="date" value={expectedDeliveryDate} onChange={e=>setExpectedDeliveryDate(e.target.value)} /></Field>
      <div style={{fontWeight:700, fontSize:13, margin:'10px 0 8px'}}>Items</div>
      {items.map((it, idx) => (
        <div key={idx} style={{display:'flex', gap:8, marginBottom:8, alignItems:'center'}}>
          <select className="input" value={it.productId} onChange={e=>updateLine(idx, { productId:e.target.value })} style={{flex:2}}>
            <option value="">Select product\u2026</option>
            {products.map(p=><option key={p.productId} value={p.productId}>{p.productName}</option>)}
          </select>
          <input className="input" type="number" min="1" value={it.quantity} onChange={e=>updateLine(idx, { quantity:Number(e.target.value) })} style={{width:80}} placeholder="Qty" />
          <input className="input" type="number" value={it.unitCost} onChange={e=>updateLine(idx, { unitCost:Number(e.target.value) })} style={{width:110}} placeholder="Unit cost" />
          <button className="icon-btn" onClick={()=>removeLine(idx)}><I name="x" size={13} /></button>
        </div>
      ))}
      <button className="btn btn-ghost btn-sm" onClick={addLine}><I name="plus" size={13}/>Add line</button>
    </Modal>
  );
}

function PurchasesPage({ command, clearCommand }) {
  const fmt = useCurrency();
  const toast = useToast();
  const { data: pos, loading, reload } = useApiData('purchaseOrders.list', {}, []);
  const { data: purchases } = useApiData('purchases.list', {}, []);

  const supplierMap = useMemo(()=>{ const m={}; (suppliers||[]).forEach(s=>m[s.supplierId]=s.supplierName); return m; }, [suppliers]);

  const markStatus = async (id, status) => {
    const res = await callServer('purchaseOrders.updateStatus', { id, status });

  return (

      } />
      <div className="tabs">
        <div className={"tab"+(tab==='orders'?" active":"")} onClick={()=>setTab('orders')} style={{cursor:'pointer'}}>Purchase Orders</div>
        <div className={"tab"+(tab==='purchases'?" active":"")} onClick={()=>setTab('purchases')} style={{cursor:'pointer'}}>Purchase History</div>
      </div>
      {tab==='orders' ? (
        <DataTable loading={loading} rows={pos} rowKey="purchaseOrderId"
          emptyIcon="purchases" emptyTitle="No purchase orders yet." emptySubtitle="Create a PO to order stock from a supplier."
          columns={[
            { key:'purchaseOrderNumber', header:'PO Number', render:r=><span className="mono">{r.purchaseOrderNumber}</span> },
            { key:'supplierId', header:'Supplier', render:r=>supplierMap[r.supplierId]||r.supplierId },
            { key:'orderDate', header:'Date', render:r=>fmtDate(r.createdAt) }, { key:'total', header:'Total', render:r=>fmt(r.total) },
            { key:'status', header:'Status', render:r=><StatusBadge status={r.status} /> },
            { key:'actions', header:'', render:r => (
              <div style={{display:'flex', gap:6}} onClick={e=>e.stopPropagation()}>
                {r.status==='Draft' && <button className="btn btn-outline btn-sm" onClick={()=>markStatus(r.purchaseOrderId,'Ordered')}>Mark Ordered</button>}
                {r.status==='Ordered' && <button className="btn btn-primary btn-sm" onClick={()=>markStatus(r.purchaseOrderId,'Received')}>Mark Received</button>}
                {(r.status==='Draft'||r.status==='Ordered') && <button className="btn btn-danger btn-sm" onClick={()=>markStatus(r.purchaseOrderId,'Cancelled')}>Cancel</button>}
                {r.status!=='Received' && <button className="icon-btn" onClick={()=>setDelRow(r)}><I name="trash" size={14}/></button>}
              </div>
            )}
          ]}
        />
      ) : (
        <DataTable loading={!purchases} rows={purchases} rowKey="purchaseId"
          emptyIcon="purchases" emptyTitle="No purchases recorded yet." emptySubtitle="Received purchase orders will appear here."
          columns={[
            { key:'purchaseOrderNumber', header:'Reference', render:r=><span className="mono">{r.purchaseOrderNumber}</span> },
            { key:'supplierId', header:'Supplier', render:r=>supplierMap[r.supplierId]||r.supplierId },
            { key:'createdAt', header:'Date', render:r=>fmtDate(r.createdAt) }, { key:'total', header:'Total', render:r=>fmt(r.total) },
            { key:'balance', header:'Balance', render:r=>fmt(r.balance) }, { key:'paymentStatus', header:'Status', render:r=><StatusBadge status={r.paymentStatus} /> },
          ]}
        />
      )}
      {showForm && <POFormModal suppliers={suppliers||[]} products={products||[]} locations={locations||[]} onClose={()=>setShowForm(false)} onSaved={reload} />}
      {delRow && <DeleteWithReasonDialog title="Delete purchase order" itemLabel={delRow.purchaseOrderNumber} onClose={() => setDelRow(null)}

    </div>
  );
}

function exportCsv(filename, rows) {
  if (!rows || !rows.length) return;
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => JSON.stringify(r[h] != null ? r[h] : '')).join(','))).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function CategoriesLocationsPanel() {
  const toast = useToast();
  const [tab, setTab] = useState('categories');
  const cats = useApiData('categories.list', {}, []);
  const locs = useApiData('locations.list', {}, []);
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [delRow, setDelRow] = useState(null);
  const [name, setName] = useState('');

  const items = tab === 'categories' ? (cats.data || []) : (locs.data || []);
  const reload = tab === 'categories' ? cats.reload : locs.reload;

  const openNew = () => { setEditing(null); setName(''); setShowForm(true); };
  const openEdit = (r) => { setEditing(r); setName(tab==='categories' ? r.categoryName : r.locationName); setShowForm(true); };

  const submit = async () => {
    if (!name.trim()) return;
    const isCategory = tab === 'categories';
    const idField = isCategory ? 'categoryId' : 'locationId';
    const dataObj = isCategory ? { categoryName: name } : { locationName: name };
    const res = editing
      ? await callServer((isCategory?'categories':'locations') + '.update', { id: editing[idField], data: dataObj })
      : await callServer((isCategory?'categories':'locations') + '.create', dataObj);
    if (res.success) { toast(editing ? 'Updated.' : 'Added.'); setShowForm(false); reload(); } else toast(res.message, 'error');
  };
  const remove = async (reason) => {
    const isCategory = tab === 'categories';
    const idField = isCategory ? 'categoryId' : 'locationId';
    const res = await callServer((isCategory?'categories':'locations') + '.delete', { id: delRow[idField], reason });
    if (res.success) { toast('Moved to recycle bin.'); reload(); } else toast(res.message, 'error');
  };

  return (
    <div className="card" style={{padding:24, maxWidth:600, marginTop:16}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
        <h3 style={{margin:0, fontSize:14.5}}>Categories & Locations</h3>
        <button className="btn btn-outline btn-sm" onClick={openNew}><I name="plus" size={13}/>Add</button>
      </div>
      <div className="tabs">
        <div className={"tab"+(tab==='categories'?" active":"")} onClick={()=>setTab('categories')} style={{cursor:'pointer'}}>Categories</div>
        <div className={"tab"+(tab==='locations'?" active":"")} onClick={()=>setTab('locations')} style={{cursor:'pointer'}}>Locations</div>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:6}}>
        {items.length === 0 && <p style={{fontSize:13, color:'var(--muted)'}}>None yet.</p>}
        {items.map(r => (
          <div key={r.categoryId || r.locationId} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 10px', border:'1px solid var(--line)', borderRadius:8}}>
            <span style={{fontSize:13}}>{tab==='categories' ? r.categoryName : r.locationName}</span>
            <div style={{display:'flex', gap:6}}>
              <button className="icon-btn" onClick={()=>openEdit(r)}><I name="edit" size={13}/></button>
              <button className="icon-btn" onClick={()=>setDelRow(r)}><I name="trash" size={13}/></button>
            </div>
          </div>
        ))}
      </div>
      {showForm && (
        <Modal title={(editing?'Edit ':'Add ') + (tab==='categories'?'Category':'Location')} onClose={()=>setShowForm(false)} footer={<React.Fragment>
          <button className="btn btn-outline" onClick={()=>setShowForm(false)}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}>Save</button>
        </React.Fragment>}>
          <Field label="Name"><input className="input" value={name} onChange={e=>setName(e.target.value)} autoFocus /></Field>
        </Modal>
      )}
      {delRow && <DeleteWithReasonDialog title={"Delete " + (tab==='categories'?'category':'location')} itemLabel={tab==='categories'?delRow.categoryName:delRow.locationName} onClose={()=>setDelRow(null)} onConfirm={remove} />}
    </div>
  );
}
