      />
    </div>
  );
}

// ============================== RECYCLE BIN ==============================
function RecycleBinPage() {
  const toast = useToast();
  const { data: items, loading, reload } = useApiData('recyclebin.list', {}, []);
  const [purgeRow, setPurgeRow] = useState(null);

  const restore = async (r) => {
    const res = await callServer('recyclebin.restore', { id: r.recordId });
    if (res.success) { toast(r.recordLabel + ' restored.'); reload(); } else toast(res.message, 'error');
  };
  const purge = async (r) => {
    const res = await callServer('recyclebin.purge', { id: r.recordId });
    if (res.success) { toast('Permanently deleted.'); reload(); } else toast(res.message, 'error');
  };

  return (
    <div>
      <PageHeader title="Recycle Bin" subtitle="Deleted records from across the business \u2014 restore or permanently remove them" />
      <DataTable loading={loading} rows={items} rowKey="recordId"
        emptyIcon="trash" emptyTitle="Recycle bin is empty." emptySubtitle="Anything deleted from Products, Customers, Suppliers and more will show up here."
        columns={[
          { key:'recordLabel', header:'Record', render:r=><div style={{fontWeight:600}}>{r.recordLabel}</div> },
          { key:'sourceSheet', header:'Table', render:r=><StatusBadge status="slate" /> },
          { key:'reason', header:'Reason for deletion' },
          { key:'deletedByName', header:'Deleted by' },
          { key:'deletedAt', header:'Deleted', render:r=>fmtDateTime(r.deletedAt) },
          { key:'actions', header:'', render:r => (
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-outline btn-sm" onClick={()=>restore(r)}><I name="refund" size={13}/>Restore</button>
              <button className="btn btn-danger btn-sm" onClick={()=>setPurgeRow(r)}>Delete Forever</button>
            </div>
          )}
        ]}
      />
      {purgeRow && <ConfirmDialog title="Permanently delete" confirmLabel="Delete Forever"
        message={"This will permanently remove \"" + purgeRow.recordLabel + "\" \u2014 it cannot be restored after this."}
        onClose={()=>setPurgeRow(null)} onConfirm={()=>purge(purgeRow)} />}
    </div>
  );
}

// ============================== PAGE ROUTER ==============================
const PAGES = {
  dashboard: DashboardPage, sales: SalesPage, products: ProductsPage, inventory: InventoryPage,
  customers: CustomersPage, suppliers: SuppliersPage, purchases: PurchasesPage, returns: ReturnsPage,
  invoices: InvoicesPage, expenses: ExpensesPage, income: IncomePage, bookkeeping: BookkeepingPage,
  reports: ReportsPage, users: UsersPage, audit: AuditLogPage, settings: SettingsPage, recyclebin: RecycleBinPage,
};

// ============================== APP ROOT ==============================
function Workspace({ session, onLogout, setSession }) {
  const [page, setPage] = useState('dashboard');
  const [command, setCommand] = useState(null);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [business, setBusinessState] = useState(session.business);
  const [tabCommand, setTabCommand] = useState(null);

  const setBusiness = (b) => { setBusinessState(b); window.__session.business = b; };

  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdkOpen(true); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const allowed = ROLE_PAGES[session.user.role];
  const effectivePage = (!allowed || allowed.indexOf(page) !== -1) ? page : 'dashboard';

  const dispatchCommand = (cmd) => {
    setPage(cmd.page);
    if (cmd.action) setCommand(cmd.action);
    if (cmd.tab) setTabCommand(cmd.tab);
  };

  const Page = PAGES[effectivePage] || DashboardPage;
  const pageCommand = effectivePage === (command && page) ? command : null;

  return (
    <AppCtx.Provider value={{ business, setBusiness, user: session.user, logout: onLogout }}>
      <div className="app-shell">
        <Sidebar page={effectivePage} setPage={(p) => { setPage(p); setCommand(null); }} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
        {mobileOpen && <div onClick={()=>setMobileOpen(false)} style={{position:'fixed', inset:0, background:'rgba(0,0,0,.3)', zIndex:35}} />}
        <div className="main">
          <Topbar onMenu={() => setMobileOpen(true)} onSearch={() => setCmdkOpen(true)} />
          <div className="content">
            <Page command={effectivePage==='bookkeeping' ? tabCommand : command} clearCommand={() => { setCommand(null); setTabCommand(null); }} dispatch={dispatchCommand} />
          </div>
        </div>
        <button className="btn btn-gold fab" style={{borderRadius:28, padding:'13px 20px', boxShadow:'var(--shadow-lg)'}} onClick={() => setCmdkOpen(true)}>
          <I name="plus" size={16} />Quick Action
        </button>
        {cmdkOpen && <CommandPalette onClose={() => setCmdkOpen(false)} dispatch={dispatchCommand} />}
      </div>
    </AppCtx.Provider>
  );
}

// ============================== APP THEME (dark/light + platform branding) ==============================
const ThemeCtx = createContext(null);
function useAppTheme() { return useContext(ThemeCtx); }

function applyBrandColors_(theme) {
  if (!theme) return;
  var root = document.documentElement;
  if (theme.primaryColor) root.style.setProperty('--brand', theme.primaryColor);
  if (theme.secondaryColor) root.style.setProperty('--brand-2', theme.secondaryColor);
  if (theme.accentColor) { root.style.setProperty('--gold', theme.accentColor); root.style.setProperty('--amber', theme.accentColor); }
}

function ThemeToggle({ className }) {
  const { dark, toggleDark } = useAppTheme();
  return (
    <button className={className || "icon-btn"} onClick={toggleDark} title={dark ? 'Switch to light mode' : 'Switch to dark mode'}>
      <I name={dark ? 'sun' : 'moon'} size={15} />
    </button>
  );
}

function BrandMark({ size=34, fontSize=15 }) {
  const { platformTheme } = useAppTheme();
  if (platformTheme && platformTheme.logoUrl) {
    return <img src={platformTheme.logoUrl} alt="logo" style={{width:size, height:size, borderRadius:9, objectFit:'cover', flexShrink:0}} />;
  }
  return <div className="brand-mark" style={{width:size, height:size, fontSize:fontSize}}>{((platformTheme && platformTheme.appName) || 'Business360').charAt(0)}</div>;
}

// ============================== PLATFORM ADMIN (super admin) ==============================

function PlatformLoginPage({ onLogin, onBack }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const submit = async (e) => {
    e.preventDefault();
    setLoading(true); setError('');
    const res = await callServer('platform.login', { email, password });
    setLoading(false);
    if (res.success) onLogin(res.data);
    else setError(res.message || 'Login failed.');
  };
  return (
    <div className="auth-wrap">
      <div className="auth-card">
        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:22}}>
          <div className="brand-mark" style={{width:40, height:40, fontSize:17, background:'linear-gradient(135deg,#4B5A70,#1C2536)'}}><I name="shield" size={18} /></div>
          <div>
            <div style={{fontFamily:'Manrope', fontWeight:800, fontSize:17}}>Platform Admin</div>
            <div style={{fontSize:11, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'.06em'}}>Business360 Super Admin</div>
          </div>
        </div>
        <form onSubmit={submit}>
          <Field label="Admin email"><input className="input" type="email" required value={email} onChange={e=>setEmail(e.target.value)} /></Field>
          <Field label="Password"><input className="input" type="password" required value={password} onChange={e=>setPassword(e.target.value)} /></Field>
          {error && <div style={{background:'#FCEBE7', color:'var(--red)', fontSize:12.5, padding:'9px 12px', borderRadius:8, marginBottom:14}}>{error}</div>}
          <button className="btn btn-primary" type="submit" style={{width:'100%', justifyContent:'center', padding:'11px'}} disabled={loading}>{loading?'Signing in\u2026':'Sign In'}</button>
        </form>
        <div style={{textAlign:'center', marginTop:18, fontSize:13, color:'var(--muted)'}}>
          <a onClick={onBack} style={{color:'var(--brand-2)', fontWeight:600, cursor:'pointer'}}>\u2190 Back to Business360</a>
        </div>
      </div>
    </div>
  );
}

const PLATFORM_NAV = [
  { key:'dashboard', label:'Overview', icon:'dashboard' },
  { key:'businesses', label:'Businesses', icon:'building' },
  { key:'tiers', label:'Subscription Tiers', icon:'layers' },
  { key:'appearance', label:'Appearance', icon:'palette' },
];

function PlatformAdminWorkspace({ session, onLogout }) {
  const [page, setPage] = useState('dashboard');
  const { dark, toggleDark } = useAppTheme();
  return (
    <div className="app-shell">
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-mark" style={{background:'linear-gradient(135deg,#4B5A70,#1C2536)'}}><I name="shield" size={16} /></div>
          <div>
            <div className="brand-name">Platform Admin</div>
            <div className="brand-sub">{session.admin.name}</div>
          </div>
        </div>
        <div className="nav-scroll">
          <div className="nav-group-label">Platform</div>
          {PLATFORM_NAV.map(it => (
            <div key={it.key} className={"nav-item" + (page===it.key?" active":"")} onClick={()=>setPage(it.key)}>
              <I name={it.icon} size={16} />{it.label}
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          <div className="user-chip" onClick={onLogout} title="Log out" style={{cursor:'pointer'}}>
            <div className="avatar">{initials(session.admin.name)}</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{color:'#fff', fontSize:12.5, fontWeight:600}}>{session.admin.name}</div>
              <div style={{fontSize:11, color:'#7C90AE'}}>Super Admin</div>
            </div>
            <I name="logout" size={15} />
          </div>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div style={{fontWeight:700, fontSize:14}}>Platform Administration</div>
          <ThemeToggle />
        </div>
        <div className="content">
          {page === 'dashboard' && <PlatformDashboardPage />}
          {page === 'businesses' && <PlatformBusinessesPage />}
          {page === 'tiers' && <PlatformTiersPage />}
          {page === 'appearance' && <PlatformAppearancePage />}
        </div>
      </div>
    </div>
  );
}

function usePlatformData(action, payload, deps) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const toast = useToast();
  const reload = useCallback(() => {
    setLoading(true);
    callServer(action, payload).then(res => {
      setLoading(false);
      if (res.success) setData(res.data);
      else toast && toast(res.message, 'error');
    });
  }, deps || []); // eslint-disable-line
  useEffect(() => { reload(); }, deps || []); // eslint-disable-line
  return { data, loading, reload };
}

function PlatformDashboardPage() {
  const { data, loading } = usePlatformData('platform.dashboard', {}, []);
  if (loading || !data) return <Skeleton h={140} />;
  return (
    <div>
      <PageHeader title="Overview" subtitle="Business360 platform-wide stats" />
      <div className="grid g4">
        <KpiCard label="Total Businesses" value={String(data.totalBusinesses)} />
        <KpiCard label="Active Businesses" value={String(data.activeBusinesses)} accent="var(--green)" />
        <KpiCard label="Total Users" value={String(data.totalUsers)} />
        <KpiCard label="Plans in use" value={String(Object.keys(data.byPlan||{}).length)} />
      </div>
      <div className="card" style={{padding:20, marginTop:16}}>
        <h3 style={{margin:'0 0 12px', fontSize:14.5}}>Businesses by Plan</h3>
        <BarListChart data={Object.keys(data.byPlan||{}).map(k=>({name:k, count:data.byPlan[k]}))} valueKey="count" labelKey="name" />
      </div>
    </div>
  );
}

function PlatformBusinessesPage() {
  const toast = useToast();
  const { data: businesses, loading, reload } = usePlatformData('platform.listBusinesses', {}, []);
  const { data: tiers } = usePlatformData('platform.listTiers', {}, []);
  const changeTier = async (b, tier) => {
    const res = await callServer('platform.updateBusinessTier', { businessId: b.businessId, tier });
    if (res.success) { toast('Plan updated.'); reload(); } else toast(res.message, 'error');
  };
  const toggleStatus = async (b) => {
    const res = await callServer('platform.updateBusinessStatus', { businessId: b.businessId, status: b.status==='Active'?'Suspended':'Active' });
    if (res.success) { toast('Business updated.'); reload(); } else toast(res.message, 'error');
  };
  return (
    <div>
      <PageHeader title="Businesses" subtitle="Every business on the platform" />
      <DataTable loading={loading} rows={businesses} rowKey="businessId"
        emptyIcon="building" emptyTitle="No businesses yet."
        columns={[
          { key:'businessName', header:'Business', render:r=><div style={{fontWeight:600}}>{r.businessName}</div> },
          { key:'email', header:'Owner Email' },
          { key:'userCount', header:'Users' },
          { key:'subscriptionPlan', header:'Plan', render:r => (
            <select className="input" style={{padding:'5px 8px', fontSize:12}} value={r.subscriptionPlan} onChange={e=>changeTier(r, e.target.value)}>
              {(tiers||[]).map(t=><option key={t.tierId} value={t.tierName}>{t.tierName}</option>)}
              {!(tiers||[]).some(t=>t.tierName===r.subscriptionPlan) && <option value={r.subscriptionPlan}>{r.subscriptionPlan}</option>}
            </select>
          )},
          { key:'status', header:'Status', render:r=><StatusBadge status={r.status} /> },
          { key:'actions', header:'', render:r => <button className="btn btn-outline btn-sm" onClick={()=>toggleStatus(r)}>{r.status==='Active'?'Suspend':'Reactivate'}</button> }
        ]}
      />
    </div>
  );
}

function TierFormModal({ onClose, onSaved, tier }) {
  const toast = useToast();
  const [form, setForm] = useState(tier || { tierName:'', price:0, billingCycle:'Monthly', maxUsers:5, maxProducts:500, maxLocations:1, features:'' });
  const [saving, setSaving] = useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const submit = async () => {
    if (!form.tierName) { toast('Tier name is required.', 'error'); return; }
    setSaving(true);
    const res = tier ? await callServer('platform.updateTier', { id: tier.tierId, data: form }) : await callServer('platform.createTier', form);
    setSaving(false);
    if (res.success) { toast(tier?'Tier updated.':'Tier created.'); onSaved(); onClose(); } else toast(res.message, 'error');
  };
  return (
    <Modal title={tier?'Edit Tier':'New Subscription Tier'} onClose={onClose} footer={<React.Fragment>
      <button className="btn btn-outline" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" disabled={saving} onClick={submit}>{saving?'Saving\u2026':'Save Tier'}</button>
    </React.Fragment>}>
      <div className="grid g2">
        <Field label="Tier name"><input className="input" value={form.tierName} onChange={e=>set('tierName', e.target.value)} placeholder="e.g. Premium" /></Field>
        <Field label="Price"><input className="input" type="number" value={form.price} onChange={e=>set('price', e.target.value)} /></Field>
      </div>
      <div className="grid g2">
        <Field label="Billing cycle">
          <select className="input" value={form.billingCycle} onChange={e=>set('billingCycle', e.target.value)}>
            {['Monthly','Yearly'].map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="Max users (-1 = unlimited)"><input className="input" type="number" value={form.maxUsers} onChange={e=>set('maxUsers', e.target.value)} /></Field>
      </div>
      <div className="grid g2">
        <Field label="Max products (-1 = unlimited)"><input className="input" type="number" value={form.maxProducts} onChange={e=>set('maxProducts', e.target.value)} /></Field>
        <Field label="Max locations (-1 = unlimited)"><input className="input" type="number" value={form.maxLocations} onChange={e=>set('maxLocations', e.target.value)} /></Field>
      </div>
      <Field label="Features (comma-separated)"><textarea className="input" rows={3} value={form.features} onChange={e=>set('features', e.target.value)} /></Field>
    </Modal>
  );
}

function PlatformTiersPage() {
  const toast = useToast();
  const { data: tiers, loading, reload } = usePlatformData('platform.listTiers', {}, []);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [delId, setDelId] = useState(null);
  return (
    <div>
      <PageHeader title="Subscription Tiers" subtitle="Plans businesses can be assigned to" action={
        <button className="btn btn-primary" onClick={()=>{setEditing(null); setShowForm(true);}}><I name="plus" size={15}/>New Tier</button>
      } />
      <div className="grid g3">
        {(tiers||[]).map(t => (
          <div key={t.tierId} className="card" style={{padding:20}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
              <div>
                <div style={{fontWeight:800, fontFamily:'Manrope', fontSize:16}}>{t.tierName}</div>
                <div style={{fontSize:20, fontWeight:800, marginTop:4}}>{Number(t.price)===0?'Free':('\u20A6'+Number(t.price).toLocaleString())}<span style={{fontSize:11, color:'var(--muted)', fontWeight:500}}>/{t.billingCycle}</span></div>
              </div>
              <div style={{display:'flex', gap:6}}>
                <button className="icon-btn" onClick={()=>{setEditing(t); setShowForm(true);}}><I name="edit" size={13}/></button>
                <button className="icon-btn" onClick={()=>setDelId(t.tierId)}><I name="trash" size={13}/></button>
              </div>
            </div>
            <div style={{fontSize:12, color:'var(--muted)', margin:'12px 0 8px'}}>
              {t.maxUsers==-1?'Unlimited':t.maxUsers} users \u00b7 {t.maxProducts==-1?'Unlimited':t.maxProducts} products \u00b7 {t.maxLocations==-1?'Unlimited':t.maxLocations} location(s)
            </div>
            <div style={{fontSize:12.5, color:'var(--ink-2)'}}>{t.features}</div>
          </div>
        ))}
      </div>
      {showForm && <TierFormModal tier={editing} onClose={()=>setShowForm(false)} onSaved={reload} />}
      {delId && <ConfirmDialog title="Delete tier" message="This tier will no longer be assignable to businesses." onClose={()=>setDelId(null)}
        onConfirm={async ()=>{ const res = await callServer('platform.deleteTier', { id: delId }); if (res.success) { toast('Tier deleted.'); reload(); } else toast(res.message,'error'); }} />}
    </div>
  );
}

function PlatformAppearancePage() {
  const toast = useToast();
  const { platformTheme, setPlatformTheme } = useAppTheme();
  const { data, loading, reload } = usePlatformData('platform.getSettings', {}, []);
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  useEffect(() => { if (data && !form) setForm(data); }, [data]);
  if (loading || !form) return <Skeleton h={200} />;
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const submit = async () => {
    setSaving(true);
    const res = await callServer('platform.updateSettings', form);
    setSaving(false);
    if (res.success) { toast('Appearance updated for all users.'); setPlatformTheme(res.data); applyBrandColors_(res.data); reload(); }
    else toast(res.message, 'error');
  };
  return (
    <div>
      <PageHeader title="Appearance" subtitle="Global branding \u2014 applies across every business on the platform" />
      <div className="card" style={{padding:24, maxWidth:560}}>
        <Field label="App name"><input className="input" value={form.appName} onChange={e=>set('appName', e.target.value)} /></Field>
        <Field label="Logo URL (leave blank to use the default letter mark)"><input className="input" value={form.logoUrl} onChange={e=>set('logoUrl', e.target.value)} placeholder="https://\u2026" /></Field>
        <div className="grid g3">
          <Field label="Primary color"><input className="input" type="color" value={form.primaryColor} onChange={e=>set('primaryColor', e.target.value)} style={{padding:4, height:40}} /></Field>
          <Field label="Secondary color"><input className="input" type="color" value={form.secondaryColor} onChange={e=>set('secondaryColor', e.target.value)} style={{padding:4, height:40}} /></Field>
          <Field label="Accent color"><input className="input" type="color" value={form.accentColor} onChange={e=>set('accentColor', e.target.value)} style={{padding:4, height:40}} /></Field>
        </div>
        <div style={{display:'flex', gap:10, alignItems:'center', margin:'10px 0 18px'}}>
          <span style={{fontSize:12, color:'var(--muted)'}}>Live preview:</span>
          <button className="btn btn-primary btn-sm" style={{background:form.primaryColor}}>Primary</button>
          <button className="btn btn-primary btn-sm" style={{background:form.secondaryColor}}>Secondary</button>
          <button className="btn btn-gold btn-sm" style={{background:form.accentColor, color:'#241705'}}>Accent</button>
        </div>
        <button className="btn btn-primary" disabled={saving} onClick={submit}>{saving?'Saving\u2026':'Save & Apply to All Users'}</button>
      </div>
    </div>
  );
}


function App() {
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState('landing'); // landing | login | signup | platformLogin
  const [platformSession, setPlatformSession] = useState(null);
  const [dark, setDark] = useState(false);
  const [platformTheme, setPlatformTheme] = useState(null);

  useEffect(() => {
    callServer('platform.publicTheme', {}).then(res => {
      if (res.success) { setPlatformTheme(res.data); applyBrandColors_(res.data); }
    });
  }, []);
  useEffect(() => { document.body.classList.toggle('theme-dark', dark); }, [dark]);

  const themeValue = { dark, toggleDark: () => setDark(d => !d), platformTheme, setPlatformTheme };

  const handleAuthed = (data) => {
    window.__session = data;
    setSession(data);
  };
  const logout = () => { window.__session = null; setSession(null); setScreen('landing'); };
  const platformLogout = () => { window.__platformToken = null; setPlatformSession(null); setScreen('landing'); };
  const handlePlatformAuthed = (data) => { window.__platformToken = data.token; setPlatformSession(data); };

  if (platformSession) {
    return (
      <ThemeCtx.Provider value={themeValue}>
        <ToastProvider>
          <PlatformAdminWorkspace session={platformSession} onLogout={platformLogout} />
        </ToastProvider>
      </ThemeCtx.Provider>
    );
  }

  if (!session) {
    return (
      <ThemeCtx.Provider value={themeValue}>
        <ToastProvider>
          {screen === 'landing' && <LandingPage onGotoLogin={() => setScreen('login')} onGotoSignup={() => setScreen('signup')} onGotoPlatformAdmin={() => setScreen('platformLogin')} />}
          {screen === 'login' && <LoginPage onLogin={handleAuthed} onGotoSignup={() => setScreen('signup')} />}
          {screen === 'signup' && <SignupPage onSignup={handleAuthed} onGotoLogin={() => setScreen('login')} />}
          {screen === 'platformLogin' && <PlatformLoginPage onLogin={handlePlatformAuthed} onBack={() => setScreen('landing')} />}
        </ToastProvider>
      </ThemeCtx.Provider>
    );
  }

  return (
    <ThemeCtx.Provider value={themeValue}>
      <ToastProvider>
        <Workspace session={session} onLogout={logout} setSession={setSession} />
      </ToastProvider>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
